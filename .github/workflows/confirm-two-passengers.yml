name: Confirm fare for 2 passengers

run-name: Confirm fare for 2 passengers

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin IATA code, for example CNF or GRU
        required: true
        type: string
      destination:
        description: Destination IATA code, for example SCL
        required: true
        type: string
      departure_date:
        description: Departure date in YYYY-MM-DD format
        required: true
        type: string
      return_date:
        description: Return date in YYYY-MM-DD format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flyclub-manual-two-passenger-confirmation
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Fly Club
        run: python -m pip install .

      - name: Validate Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          missing=0
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Secret ${name} is not configured"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Search and notify without persistence
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          flyclub-confirm-two
          --origin "${{ inputs.origin }}"
          --destination "${{ inputs.destination }}"
          --departure-date "${{ inputs.departure_date }}"
          --return-date "${{ inputs.return_date }}"
