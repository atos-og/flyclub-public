name: Compare nearby travel dates

run-name: Compare nearby travel dates

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin IATA code, for example BOS
        required: true
        type: string
      destination:
        description: Destination IATA code, for example YUL
        required: true
        type: string
      departure_date:
        description: Desired departure date in YYYY-MM-DD format
        required: true
        type: string
      return_date:
        description: Desired return date in YYYY-MM-DD format
        required: true
        type: string
      window_days:
        description: Days before and after each desired date
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      passengers:
        description: Number of passengers included in the displayed total
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      max_stops:
        description: Maximum accepted stops
        required: true
        default: ANY
        type: choice
        options:
          - ANY
          - NON_STOP
          - ONE_OR_FEWER_STOPS
          - TWO_OR_FEWER_STOPS

permissions:
  contents: read

concurrency:
  group: flyclub-manual-date-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Fly Club
        run: python -m pip install .

      - name: Validate Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          missing=0
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Secret ${name} is not configured"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Search matrix and notify without persistence
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_ORIGIN: ${{ inputs.origin }}
          INPUT_DESTINATION: ${{ inputs.destination }}
          INPUT_DEPARTURE_DATE: ${{ inputs.departure_date }}
          INPUT_RETURN_DATE: ${{ inputs.return_date }}
          INPUT_WINDOW_DAYS: ${{ inputs.window_days }}
          INPUT_PASSENGERS: ${{ inputs.passengers }}
          INPUT_MAX_STOPS: ${{ inputs.max_stops }}
        run: >-
          flyclub-date-matrix
          --origin "${INPUT_ORIGIN}"
          --destination "${INPUT_DESTINATION}"
          --departure-date "${INPUT_DEPARTURE_DATE}"
          --return-date "${INPUT_RETURN_DATE}"
          --window-days "${INPUT_WINDOW_DAYS}"
          --passengers "${INPUT_PASSENGERS}"
          --max-stops "${INPUT_MAX_STOPS}"
