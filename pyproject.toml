[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flyclub"
version = "0.1.0"
description = "A personal radar for exceptional flight opportunities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flights @ git+https://github.com/punitarani/fli.git@121d34fea056dc513258958c4262cb5a4cc033c1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[project.scripts]
flyclub = "flyclub.main:cli"
flyclub-confirm-two = "flyclub.manual_confirmation:cli"
flyclub-db-migrate = "flyclub.storage.migrations:cli"
flyclub-flexible-dates = "flyclub.flexible_dates:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/flyclub"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
