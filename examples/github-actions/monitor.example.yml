name: Monitor flights

on:
  schedule:
    # Native fallback runs 30 minutes after the external primary schedule.
    - cron: "47 0,3,6,9,12,15,18,21 * * *"
    - cron: "17 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: flyclub-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Skip native fallback after a recent external dispatch
        id: schedule_guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cutoff="$(date -u -d '70 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')"
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/runs?event=workflow_dispatch&per_page=10"
          if ! response="$(curl --fail --silent --show-error --max-time 10 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${endpoint}")"; then
            echo "::warning::Could not inspect recent dispatches; native fallback will run"
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          recent="$(jq --arg cutoff "${cutoff}" '[.workflow_runs[] | select(
            .created_at >= $cutoff and (.status != "completed" or .conclusion == "success")
          )] | length' <<< "${response}")"
          if [[ "${recent}" -gt 0 ]]; then
            echo "Recent external dispatch found; native fallback is not needed"
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "No recent successful external dispatch found; native fallback will run"
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Notify Healthchecks start
        if: ${{ steps.schedule_guard.outputs.should_run == 'true' }}
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        shell: bash
        run: |
          if [[ -z "${HEALTHCHECKS_PING_URL:-}" ]]; then
            echo "::warning::HEALTHCHECKS_PING_URL is not configured; external heartbeat disabled"
            exit 0
          fi

          curl --fail --silent --show-error --max-time 10 --retry 5 \
            --output /dev/null "${HEALTHCHECKS_PING_URL}/start" \
            || echo "::warning::Healthchecks start ping failed; monitor will continue"

      - name: Check out repository
        if: ${{ steps.schedule_guard.outputs.should_run == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ vars.FLYCLUB_SOURCE_REPOSITORY }}
          ref: ${{ vars.FLYCLUB_SOURCE_REF }}
          persist-credentials: false

      - name: Set up Python
        if: ${{ steps.schedule_guard.outputs.should_run == 'true' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Fly Club
        if: ${{ steps.schedule_guard.outputs.should_run == 'true' }}
        run: python -m pip install .

      - name: Validate required secrets
        if: ${{ steps.schedule_guard.outputs.should_run == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLYCLUB_ROUTES_YAML: ${{ secrets.FLYCLUB_ROUTES_YAML }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        shell: bash
        run: |
          missing=0
          for name in \
            DATABASE_URL \
            FLYCLUB_ROUTES_YAML \
            TELEGRAM_BOT_TOKEN \
            TELEGRAM_CHAT_ID \
            HEALTHCHECKS_PING_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Secret ${name} is not configured"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Apply database migrations
        if: ${{ steps.schedule_guard.outputs.should_run == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: flyclub-db-migrate

      - name: Run monitor
        if: ${{ steps.schedule_guard.outputs.should_run == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLYCLUB_ROUTES_YAML: ${{ secrets.FLYCLUB_ROUTES_YAML }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: flyclub --monitor

      - name: Notify Healthchecks completion
        if: ${{ always() && steps.schedule_guard.outputs.should_run == 'true' }}
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          MONITOR_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ -z "${HEALTHCHECKS_PING_URL:-}" ]]; then
            echo "::warning::HEALTHCHECKS_PING_URL is not configured; completion ping skipped"
            exit 0
          fi

          ping_url="${HEALTHCHECKS_PING_URL}"
          ping_state="success"
          if [[ "${MONITOR_JOB_STATUS}" != "success" ]]; then
            ping_url="${HEALTHCHECKS_PING_URL}/fail"
            ping_state="failure"
          fi

          curl --fail --silent --show-error --max-time 10 --retry 5 \
            --output /dev/null "${ping_url}" \
            || echo "::warning::Healthchecks ${ping_state} ping failed; job result is unchanged"
