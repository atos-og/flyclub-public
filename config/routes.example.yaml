# Public example only. Keep real destinations and dates in config/routes.yaml
# (ignored by Git) or in the FLYCLUB_ROUTES_YAML GitHub Secret.
trip:
  departure_date: "2027-06-10"
  return_date: "2027-06-20"
  passengers: 1
  cabin: ECONOMY
  currency: BRL
  max_stops: ANY

origins:
  from_bh:
    label: Belo Horizonte
    role: HOME
    airports:
      - CNF

  from_sao_paulo:
    label: São Paulo
    role: POSITIONING
    airports:
      - GRU
      - VCP
      - CGH
    notice: "Saída de São Paulo — deslocamento BH → SP não incluído."
    # Round-trip feeder ticket/ground transport estimate for the configured passenger count.
    positioning_cost_estimate: 650

destinations:
  - code: LIS
    name: Lisboa
    alert_price: 3000

  - code: MAD
    name: Madri

  - code: MIA
    name: Miami
    alert_price: 2500

# Optional independent opportunity radar. It is not part of the main 90-minute monitor.
discovery:
  origin_groups:
    - from_bh
    - from_sao_paulo
  destinations:
    - {code: SFO, name: San Francisco, minimum_deal_score: 60}
    - {code: SLZ, name: São Luís, minimum_deal_score: 60}
    - {code: JPA, name: João Pessoa, minimum_deal_score: 60}
    - {code: PMW, name: Palmas / Jalapão, minimum_deal_score: 60}
    - {code: EZE, name: Buenos Aires, minimum_deal_score: 60}
    - {code: SCL, name: Santiago, minimum_deal_score: 60}
    - {code: BOG, name: Bogotá, minimum_deal_score: 60}
    - {code: CTG, name: Cartagena, minimum_deal_score: 60}
    - {code: LIM, name: Lima, minimum_deal_score: 60}
    - {code: CUZ, name: Cusco, minimum_deal_score: 60}
    - {code: MVD, name: Montevidéu, minimum_deal_score: 60}
    - {code: PUJ, name: Punta Cana, minimum_deal_score: 60}
    - {code: LIS, name: Lisboa, minimum_deal_score: 90}
    - {code: MAD, name: Madri, minimum_deal_score: 90}
    - {code: CDG, name: Paris, minimum_deal_score: 90}

monitor:
  max_results_per_route: 5
  retry_attempts: 3
  retry_base_delay_seconds: 2

analysis:
  min_score_samples: 12
  low_confidence_max_samples: 30
  moderate_confidence_max_samples: 100
  deal_score_weights:
    percentile: 40
    median_discount: 25
    recorded_low_proximity: 15
    recent_drop: 10
    trend: 10

alerts:
  exceptional_score: 90
  cooldown_hours: 24
  min_drop_amount: 100
  min_drop_percent: 5
  positioning_context_min_savings: 100

health:
  problem_alert_after_runs: 3

